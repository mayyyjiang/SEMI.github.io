<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swift Accelerator Program (SAP) — TikTok Shop by Tokopedia</title>
<meta name="description" content="Swift Accelerator Program (SAP) — layanan penjualan terkelola dari TikTok Shop by Tokopedia untuk seller UKM di Indonesia.">
<style>
:root{
  --bg:#000000;
  --blue:#25F4EE;
  --blue-deep:#0A8DCC;
  --blue-glow:#1FB6FF;
  --pink:#FE2C55;
  --white:#FFFFFF;
  --gray:#9AA4B2;
  --card:#0B0F16;
  --card-line:rgba(37,244,238,.25);
  --txt:#D6DEE8;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  color:var(--white);
  display:flex;
  justify-content:center;
  padding:40px 16px 60px;
}
.poster{
  width:960px;
  max-width:100%;
  position:relative;
  background:
    radial-gradient(900px 500px at 85% -5%, rgba(37,244,238,.12), transparent 60%),
    radial-gradient(700px 500px at 0% 100%, rgba(10,141,204,.18), transparent 55%),
    var(--bg);
  border:1px solid rgba(37,244,238,.18);
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 0 60px rgba(37,244,238,.08);
}
/* ===== HEADER ===== */
.header{
  padding:56px 48px 38px;
  text-align:center;
  position:relative;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.logo{position:absolute;top:24px;left:28px;z-index:5;display:flex;align-items:center;}
.logo img{display:block;height:28px;width:auto;}
/* language switch */
.lang{
  position:absolute;top:22px;right:26px;z-index:6;
  display:flex;gap:4px;padding:4px;
  border:1px solid var(--card-line);
  border-radius:999px;
  background:rgba(37,244,238,.05);
  backdrop-filter:blur(6px);
}
.lang button{
  font:inherit;font-size:12px;font-weight:700;letter-spacing:1px;
  color:var(--gray);background:transparent;border:none;cursor:pointer;
  padding:6px 14px;border-radius:999px;transition:.25s;
}
.lang button:hover{color:var(--white);}
.lang button.on{background:linear-gradient(92deg,var(--blue),var(--blue-deep));color:#04202b;}
.badge{
  display:inline-block;font-size:12.5px;letter-spacing:2px;color:var(--blue);
  border:1px solid var(--card-line);border-radius:999px;padding:7px 18px;
  margin-bottom:22px;background:rgba(37,244,238,.05);
}
.title{font-size:46px;font-weight:900;line-height:1.2;margin-bottom:10px;}
.title .rest{
  background:linear-gradient(92deg,#FFFFFF 0%, var(--blue) 60%, var(--blue-glow) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.subtitle{font-size:17px;font-weight:700;color:var(--white);letter-spacing:3px;margin-bottom:18px;}
.tagline{
  display:inline-block;font-size:15px;font-weight:700;color:var(--blue);letter-spacing:1px;
  margin:0 auto 18px;padding:8px 22px;border:1px solid var(--card-line);border-radius:999px;
  background:rgba(37,244,238,.06);
}
.lead{font-size:14.5px;line-height:1.9;color:var(--gray);max-width:720px;margin:0 auto;}
.lead b{color:var(--blue);font-weight:700;}
.hero-cta{display:flex;gap:12px;justify-content:center;margin-top:26px;flex-wrap:wrap;}
.btn{
  font:inherit;font-size:14px;font-weight:800;letter-spacing:.5px;cursor:pointer;
  padding:13px 28px;border-radius:999px;border:1px solid var(--card-line);
  background:rgba(37,244,238,.06);color:var(--blue);transition:.25s;
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;
}
.btn:hover{background:rgba(37,244,238,.14);transform:translateY(-2px);}
.btn.primary{
  background:linear-gradient(92deg,var(--blue),var(--blue-deep));
  color:#04202b;border-color:transparent;
  box-shadow:0 8px 26px rgba(37,244,238,.25);
}
.btn.primary:hover{box-shadow:0 12px 34px rgba(37,244,238,.4);}
/* ===== NAV ===== */
.nav{
  display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
  padding:14px 40px;border-bottom:1px solid rgba(255,255,255,.05);
  background:rgba(0,0,0,.5);position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);
}
.nav a{
  font-size:12.5px;color:var(--gray);text-decoration:none;padding:7px 13px;border-radius:999px;transition:.2s;
}
.nav a:hover{color:var(--blue);background:rgba(37,244,238,.08);}
/* ===== SECTION ===== */
.section{padding:38px 48px;}
.section + .section{border-top:1px solid rgba(255,255,255,.05);}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.sec-head .bar{width:5px;height:24px;border-radius:4px;background:linear-gradient(var(--blue),var(--blue-deep));}
.sec-head h2{font-size:22px;font-weight:800;letter-spacing:1px;}
.sec-sub{font-size:13px;color:var(--gray);margin:0 0 22px 17px;line-height:1.7;}
/* cards grid */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.fit{background:var(--card);border:1px solid var(--card-line);border-radius:16px;padding:22px 20px;}
.fit .ico{font-size:22px;margin-bottom:10px;}
.fit h4{font-size:14.5px;color:var(--blue);margin-bottom:9px;line-height:1.4;}
.fit p{font-size:12.5px;color:var(--txt);line-height:1.8;}
/* generic dark table */
.tbl-wrap{width:100%;overflow-x:auto;border-radius:12px;border:1px solid rgba(37,244,238,.18);margin-top:16px;}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px;background:rgba(0,0,0,.35);min-width:520px;}
table.dt th{
  background:rgba(37,244,238,.10);color:var(--blue);font-weight:700;text-align:left;
  padding:11px 13px;font-size:11.5px;letter-spacing:.5px;border-bottom:1px solid rgba(37,244,238,.22);
  white-space:nowrap;
}
table.dt td{
  padding:11px 13px;color:var(--txt);line-height:1.6;vertical-align:middle;
  border-bottom:1px solid rgba(255,255,255,.06);border-right:1px solid rgba(255,255,255,.05);
}
table.dt td:last-child,table.dt th:last-child{border-right:none;}
table.dt tr:last-child td{border-bottom:none;}
table.dt td.k{color:#fff;font-weight:700;white-space:nowrap;}
table.dt td.c{text-align:center;}
table.dt td.rate{color:var(--blue);font-weight:800;font-size:14px;text-align:center;white-space:nowrap;}
table.dt td.dim{color:var(--gray);}
table.dt tbody tr:hover td{background:rgba(37,244,238,.04);}
/* roles */
.roles{display:flex;flex-direction:column;gap:18px;}
.role{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:24px 22px;}
.role.merchant h3{font-size:17px;color:var(--white);margin-bottom:6px;}
.role.merchant .desc{font-size:12.5px;color:var(--gray);margin-bottom:16px;line-height:1.6;}
.role.platform{
  border-color:var(--card-line);
  box-shadow:inset 0 0 60px rgba(37,244,238,.06),0 0 30px rgba(37,244,238,.05);
  background:linear-gradient(135deg,rgba(37,244,238,.05),rgba(10,141,204,.04));
  padding:26px 26px 22px;
}
.role.platform > h3{font-size:20px;color:var(--blue);margin-bottom:18px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  font-size:12.5px;padding:7px 12px;border-radius:10px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:var(--txt);
}
.svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.svc{background:rgba(0,0,0,.35);border:1px solid rgba(37,244,238,.18);border-radius:14px;padding:16px 16px 14px;}
.svc h4{font-size:14.5px;color:var(--blue);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.svc ul{list-style:none;}
.svc li{font-size:12.5px;color:var(--txt);line-height:1.75;padding-left:16px;position:relative;}
.svc li::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--blue);}
/* callout */
.callout{
  font-size:12.5px;color:#BFF6F4;line-height:1.8;
  background:rgba(37,244,238,.06);border-left:3px solid var(--blue);
  padding:13px 16px;border-radius:0 10px 10px 0;margin-top:16px;
}
.callout b{color:#fff;}
.note{
  font-size:11.5px;color:#B4BDC8;line-height:1.8;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);
  border-radius:12px;padding:14px 18px;margin-top:16px;
}
.note h5{font-size:12px;color:var(--blue);font-weight:700;margin-bottom:6px;letter-spacing:.5px;}
.note li{margin:4px 0 4px 16px;list-style:disc;}
/* fee */
.formula{
  background:linear-gradient(135deg,rgba(37,244,238,.07),rgba(10,141,204,.04));
  border:1px solid var(--card-line);border-radius:16px;padding:20px 22px;
  font-size:16px;font-weight:800;line-height:1.7;text-align:center;
}
.formula b{color:var(--blue);}
.formula .op{color:var(--gray);font-weight:400;margin:0 6px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px;}
/* tier switch (segmented control) */
.tier-switch{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.tier-switch button{
  font:inherit;font-size:12px;font-weight:700;cursor:pointer;
  background:rgba(0,0,0,.45);color:#B4BDC8;
  border:1px solid rgba(37,244,238,.20);border-radius:999px;
  padding:9px 15px;transition:.2s;letter-spacing:.2px;
}
.tier-switch button small{display:block;font-size:10.5px;font-weight:600;opacity:.75;margin-top:2px;letter-spacing:0;}
.tier-switch button:hover{border-color:var(--blue);color:#fff;}
.tier-switch button.on{
  background:linear-gradient(135deg,rgba(37,244,238,.20),rgba(10,141,204,.12));
  border-color:var(--blue);color:#fff;box-shadow:0 0 0 3px rgba(37,244,238,.10);
}
.tier{background:var(--card);border:1px solid var(--card-line);border-radius:16px;padding:18px 18px;text-align:center;}
.tier .lbl{font-size:11.5px;color:var(--blue);font-weight:800;letter-spacing:1.5px;margin-bottom:8px;}
.tier .val{font-size:15px;color:#fff;font-weight:700;line-height:1.5;}
.tier .sub{font-size:11.5px;color:var(--gray);margin-top:7px;line-height:1.6;}
/* fee lookup */
.lookup{
  background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:18px;
  padding:20px 22px;margin-top:18px;
}
.lookup h4{font-size:15px;color:#fff;margin-bottom:4px;}
.lookup .hint{font-size:12px;color:var(--gray);margin-bottom:16px;line-height:1.6;}
.controls{display:flex;gap:12px;flex-wrap:wrap;}
.controls > *{flex:1 1 200px;}
select,input[type=text],input[type=number],input[type=search]{
  font:inherit;font-size:13px;width:100%;
  background:rgba(0,0,0,.5);color:#fff;
  border:1px solid rgba(37,244,238,.22);border-radius:10px;padding:11px 13px;
  outline:none;transition:.2s;
}
select option{background:#0B0F16;color:#fff;}
input::placeholder{color:#67707d;}
select:focus,input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,244,238,.12);}
.result-meta{font-size:12px;color:var(--gray);margin-top:14px;}
.result-meta b{color:var(--blue);}
.empty{font-size:12.5px;color:var(--gray);padding:22px;text-align:center;}
/* fee lookup scroll box — only 5 rows visible, rest scrolls */
.fee-scroll{max-height:256px;overflow-y:auto;overflow-x:auto;overscroll-behavior:contain;}
#feeTable thead th{height:46px;padding-top:0;padding-bottom:0;}
#feeTable tbody td{height:42px;padding-top:0;padding-bottom:0;white-space:nowrap;}
#feeTable tbody td.empty{height:auto;padding:22px;white-space:normal;}
.fee-scroll::-webkit-scrollbar{width:9px;height:9px;}
.fee-scroll::-webkit-scrollbar-track{background:rgba(255,255,255,.04);border-radius:9px;}
.fee-scroll::-webkit-scrollbar-thumb{background:rgba(37,244,238,.32);border-radius:9px;}
.fee-scroll::-webkit-scrollbar-thumb:hover{background:rgba(37,244,238,.55);}
#feeTable thead th{position:sticky;top:0;z-index:3;background:#0D2226;}
/* 6 columns must fit without horizontal scrolling */
#feeTable{table-layout:fixed;min-width:0;}
#feeTable th,#feeTable td{padding-left:10px;padding-right:10px;}
#feeTable th:nth-child(1),#feeTable td:nth-child(1){width:23%;}
#feeTable th:nth-child(2),#feeTable td:nth-child(2){width:24%;}
#feeTable th:nth-child(3),#feeTable td:nth-child(3),
#feeTable th:nth-child(4),#feeTable td:nth-child(4),
#feeTable th:nth-child(5),#feeTable td:nth-child(5){width:13%;text-align:center;}
#feeTable th:nth-child(3),#feeTable td:nth-child(3),
#feeTable th:nth-child(4),#feeTable td:nth-child(4){width:12%;}
#feeTable th:nth-child(6),#feeTable td:nth-child(6){width:16%;text-align:center;}
#feeTable th:nth-child(n+3){text-align:center;}
#feeTable tbody td:nth-child(1),#feeTable tbody td:nth-child(2){overflow:hidden;text-overflow:ellipsis;}
#feeTable thead th{white-space:normal;line-height:1.3;font-size:11px;}
.scroll-hint{
  font-size:11.5px;color:var(--blue);opacity:.85;margin-top:9px;
  display:flex;align-items:center;gap:6px;letter-spacing:.2px;
}
.scroll-hint::before{content:"⇕";font-size:13px;}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.stat{
  background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:16px;
  padding:20px 14px;text-align:center;transition:.3s;
}
.stat:hover{border-color:var(--card-line);transform:translateY(-3px);}
.stat .num{font-size:26px;font-weight:900;color:var(--blue);line-height:1.2;}
.stat .num small{font-size:13px;font-weight:700;}
.stat .cap{font-size:11.5px;color:var(--gray);margin-top:8px;line-height:1.55;}
/* steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.step{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:20px 18px;position:relative;}
.step.last{border-color:var(--card-line);background:linear-gradient(135deg,rgba(37,244,238,.05),rgba(10,141,204,.03));}
.step .no{
  font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--blue);
  border:1px solid var(--card-line);border-radius:999px;padding:4px 10px;display:inline-block;margin-bottom:12px;
}
.step h4{font-size:14px;color:#fff;margin-bottom:10px;line-height:1.4;}
.step ul{list-style:none;}
.step li{font-size:12px;color:var(--txt);line-height:1.7;padding-left:14px;position:relative;}
.step li::before{content:"";position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:var(--blue);}
.step a{color:var(--blue);word-break:break-all;font-size:11.5px;}
/* faq */
.faq-item{
  background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:14px;
  margin-bottom:10px;overflow:hidden;
}
.faq-q{
  width:100%;font:inherit;text-align:left;cursor:pointer;
  background:transparent;border:none;color:#fff;font-size:13.5px;font-weight:700;
  padding:16px 46px 16px 18px;position:relative;line-height:1.6;
}
.faq-q::after{
  content:"+";position:absolute;right:18px;top:50%;transform:translateY(-50%);
  color:var(--blue);font-size:20px;font-weight:400;transition:.25s;
}
.faq-item.open .faq-q::after{content:"−";}
.faq-item.open{border-color:var(--card-line);}
.faq-a{
  max-height:0;overflow:hidden;transition:max-height .3s ease;
  font-size:12.5px;color:var(--txt);line-height:1.85;
}
.faq-a > div{padding:0 18px 16px;}
/* contact */
.contact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.contact-card{
  background:var(--card);border:1px solid var(--card-line);border-radius:18px;
  padding:24px 20px;text-align:center;box-shadow:inset 0 0 40px rgba(37,244,238,.04);
}
.contact-card .ico{font-size:26px;margin-bottom:12px;}
.contact-card h4{font-size:14px;color:var(--blue);margin-bottom:10px;letter-spacing:.5px;}
.contact-card .val{font-size:14px;font-weight:700;color:var(--white);word-break:break-word;line-height:1.5;}
.contact-card .tip{font-size:11.5px;color:var(--gray);margin-top:9px;line-height:1.6;}
.tbd{
  display:inline-block;font-size:11px;font-weight:700;letter-spacing:1px;
  color:#FFD166;background:rgba(255,209,102,.1);border:1px dashed rgba(255,209,102,.45);
  border-radius:8px;padding:6px 12px;
}
/* lead-gen banner */
.leadgen{
  background:linear-gradient(135deg,rgba(37,244,238,.1),rgba(254,44,85,.06));
  border:1px solid var(--card-line);border-radius:20px;padding:30px 28px;text-align:center;
}
.leadgen h3{font-size:21px;font-weight:900;margin-bottom:10px;}
.leadgen p{font-size:13px;color:var(--txt);line-height:1.8;max-width:620px;margin:0 auto 20px;}
.leadgen .fields{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:22px;}
.leadgen .fields span{
  font-size:11.5px;color:var(--blue);background:rgba(37,244,238,.08);
  border:1px solid var(--card-line);border-radius:999px;padding:6px 14px;
}
.demo-flag{
  font-size:11px;color:#FFD166;background:rgba(255,209,102,.08);
  border:1px dashed rgba(255,209,102,.4);border-radius:10px;
  padding:9px 14px;margin-top:18px;display:inline-block;line-height:1.6;
}
/* modal */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.overlay.show{display:flex;}
.modal{
  width:460px;max-width:100%;max-height:92vh;overflow-y:auto;
  background:
    radial-gradient(500px 260px at 100% 0%, rgba(37,244,238,.12), transparent 60%),
    #05080D;
  border:1px solid var(--card-line);border-radius:22px;padding:30px 28px;
  box-shadow:0 24px 80px rgba(0,0,0,.7);position:relative;
  animation:pop .28s ease;
}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:none;}}
.modal .x{
  position:absolute;top:16px;right:18px;background:transparent;border:none;
  color:var(--gray);font-size:24px;cursor:pointer;line-height:1;transition:.2s;
}
.modal .x:hover{color:var(--white);}
.modal h3{font-size:20px;font-weight:900;margin-bottom:8px;padding-right:26px;}
.modal .msub{font-size:12.5px;color:var(--gray);line-height:1.7;margin-bottom:22px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--txt);margin-bottom:7px;}
.field label .req{color:var(--pink);margin-left:3px;}
.field .fhint{font-size:11px;color:#67707d;margin-top:6px;line-height:1.5;}
.field .err{font-size:11.5px;color:#FF7A93;margin-top:6px;display:none;}
.field.bad input{border-color:#FF7A93;box-shadow:0 0 0 3px rgba(255,122,147,.12);}
.field.bad .err{display:block;}
.prefix{display:flex;align-items:stretch;gap:0;}
.prefix .tag{
  display:flex;align-items:center;padding:0 12px;font-size:13px;color:var(--blue);
  background:rgba(37,244,238,.08);border:1px solid rgba(37,244,238,.22);border-right:none;
  border-radius:10px 0 0 10px;white-space:nowrap;
}
.prefix input{border-radius:0 10px 10px 0;}
.modal .btn{width:100%;justify-content:center;margin-top:6px;}
.privacy{font-size:11px;color:#67707d;line-height:1.7;margin-top:14px;text-align:center;}
/* embedded Lark form */
.modal.embed{width:820px;padding:26px 24px 20px;}
.embed-wrap{
  position:relative;border-radius:14px;overflow:hidden;background:#F6F5F1;
  border:1px solid rgba(255,255,255,.14);height:min(66vh,600px);
}
.embed-wrap iframe{
  position:absolute;left:0;top:-52px;width:100%;height:calc(100% + 52px);
  border:0;display:block;background:#F6F5F1;
}
.embed-note{
  position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;
  align-items:center;justify-content:center;background:#0B1116;
  color:var(--gray);font-size:12.5px;text-align:center;padding:26px;line-height:1.8;white-space:pre-line;
}
.embed-note.hide{display:none;}
.embed-foot{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap;}
.embed-foot .privacy{margin:0;text-align:left;flex:1;min-width:220px;}
.embed-foot .btn{width:auto;margin-top:0;font-size:12.5px;padding:10px 20px;}
@media(max-width:760px){
  .modal.embed{padding:20px 14px 16px;}
  .embed-wrap{height:70vh;}
  .embed-foot .btn{width:100%;justify-content:center;}
}
/* success */
.done{text-align:center;padding:12px 0 4px;}
.done .tick{
  width:64px;height:64px;border-radius:50%;margin:0 auto 18px;
  background:rgba(37,244,238,.1);border:1px solid var(--card-line);
  display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--blue);
}
.done h3{font-size:19px;margin-bottom:10px;}
.done p{font-size:12.5px;color:var(--gray);line-height:1.8;margin-bottom:18px;}
.recap{
  text-align:left;background:rgba(0,0,0,.4);border:1px solid rgba(37,244,238,.18);
  border-radius:12px;padding:14px 16px;margin-bottom:18px;
}
.recap div{font-size:12px;color:var(--txt);line-height:1.9;display:flex;justify-content:space-between;gap:12px;}
.recap div span:first-child{color:var(--gray);}
.recap div span:last-child{color:#fff;font-weight:700;text-align:right;word-break:break-word;}
/* footer */
.footer{
  text-align:center;padding:26px 24px;font-size:11px;color:#5A6472;
  letter-spacing:.5px;border-top:1px solid rgba(255,255,255,.05);line-height:1.9;
}
.footer a{color:#8792a0;}
@media(max-width:760px){
  body{padding:16px 10px 40px;}
  .grid3,.grid2,.grid4,.svc-grid,.tiers,.stats,.steps,.contact-grid{grid-template-columns:1fr;}
  .stats,.grid4{grid-template-columns:1fr 1fr;}
  .title{font-size:31px;}
  .section{padding:28px 20px;}
  .header{padding:64px 20px 30px;}
  .lang{top:16px;right:14px;}
  .logo{top:18px;left:16px;}
  .logo img{height:22px;}
  .nav{padding:12px 14px;}
  .formula{font-size:14px;}
}
</style>
</head>

  FEE_DATA.forEach(function (r) { if (L1.indexOf(r.l1) < 0) L1.push(r.l1); });
  L1.sort();
  var curTier = "B";

  function renderCatSelect() {
    var sel = $("#catSelect");
    var keep = sel.value;
    sel.innerHTML = '<option value="">' + T.s3AllCat + " (" + L1.length + ")</option>" +
      L1.map(function (c) { return '<option value="' + c + '">' + c + "</option>"; }).join("");
    if (keep) sel.value = keep;
  }

  function renderTierSwitch() {
    $("#tierSwitch").innerHTML = T.tierOpts.map(function (o) {
      return '<button type="button" data-tier="' + o.k + '"' + (o.k === curTier ? ' class="on"' : "") +
        ">" + o.n + "<small>" + o.s + "</small></button>";
    }).join("");
  }

  function tierName(k) {
    for (var i = 0; i < T.tierOpts.length; i++) if (T.tierOpts[i].k === k) return T.tierOpts[i].n;
    return k;
  }

  function renderFeeTable() {
    var cat = $("#catSelect").value;
    var q = $("#catSearch").value.trim().toLowerCase();
    var rows = FEE_DATA.filter(function (r) {
      if (cat && r.l1 !== cat) return false;
      if (q && (r.l1 + " " + r.l2 + " " + r.id).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    if (!rows.length) {
      $("#feeBody").innerHTML = '<tr><td colspan="6" class="empty">' + T.feeEmpty + "</td></tr>";
      $("#feeMeta").innerHTML = "";
      return;
    }
    $("#feeBody").innerHTML = rows.map(function (r) {
      var v = r.r[curTier];
      return '<tr><td class="dim">' + r.l1 + '</td><td class="k">' + r.l2 +
        '</td><td class="c dim">' + pct(v[0]) +
        '</td><td class="c dim">' + pct(v[1]) +
        '</td><td class="c dim">' + pct(v[2]) +
        '</td><td class="rate">' + pct(v[3]) + "</td></tr>";
    }).join("");
    $("#feeMeta").innerHTML = T.feeMetaTpl.replace("{n}", rows.length).replace("{tier}", tierName(curTier));
  }

  /* ---------- growth / join / faq / contact ---------- */
  function renderGrowth() {
    $("#statCards").innerHTML = T.stats.map(function (s) {
      return '<div class="stat"><div class="num">' + s.num + '</div><div class="cap">' + s.cap + "</div></div>";
    }).join("");
    $("#stratBody").innerHTML = T.strat.map(function (r) {
      return '<tr><td class="k">' + r[0] + "</td><td>" + r[1] + "</td><td>" + r[2] +
        "</td><td>" + r[3] + '</td><td class="dim">' + r[4] + "</td></tr>";
    }).join("");
  }

  function renderSteps() {
    $("#stepCards").innerHTML = T.steps.map(function (s) {
      return '<div class="step' + (s.last ? " last" : "") + '"><div class="no">' + s.no +
        '</div><h4>' + s.h + "</h4><ul>" +
        s.li.map(function (l) { return "<li>" + l + "</li>"; }).join("") + "</ul>" +
        (s.link ? '<div style="margin-top:12px"><a href="' + s.link + '" target="_blank" rel="noopener">' + s.linkText + "</a></div>" : "") +
        "</div>";
    }).join("");
  }

  function renderFaq() {
    $("#faqList").innerHTML = T.faq.map(function (f, i) {
      return '<div class="faq-item"><button class="faq-q" data-faq="' + i + '">' + f[0] +
        '</button><div class="faq-a"><div>' + f[1] + "</div></div></div>";
    }).join("");
    $$("[data-faq]").forEach(function (b) {
      b.addEventListener("click", function () {
        var item = b.parentNode, a = $(".faq-a", item), open = item.classList.contains("open");
        $$(".faq-item").forEach(function (it) {
          it.classList.remove("open");
          $(".faq-a", it).style.maxHeight = "0px";
        });
        if (!open) { item.classList.add("open"); a.style.maxHeight = a.scrollHeight + "px"; }
      });
    });
  }

  function renderContact() {
    $("#contactCards").innerHTML = T.contacts.map(function (c) {
      return '<div class="contact-card"><div class="ico">' + c.ico + '</div><h4>' + c.h +
        '</h4><div class="val"><span class="tbd">' + c.tbd + '</span></div><div class="tip">' + c.tip + "</div></div>";
    }).join("");
  }

  function renderAll() {
    T = I18N[lang];
    renderStatic();
    renderProfiles();
    renderRows("#eligibilityBody", T.eligibility);
    renderService();
    renderFeeStatic();
    renderCatSelect();
    renderTierSwitch();
    renderFeeTable();
    renderGrowth();
    renderSteps();
    renderFaq();
    renderContact();
  }

  /* ---------- language switch ---------- */
  $$(".lang button").forEach(function (b) {
    b.addEventListener("click", function () {
      lang = b.getAttribute("data-lang");
      $$(".lang button").forEach(function (x) { x.classList.toggle("on", x === b); });
      renderAll();
    });
  });

  /* ---------- fee lookup events ---------- */
  $("#catSelect").addEventListener("change", renderFeeTable);
  $("#catSearch").addEventListener("input", renderFeeTable);
  $("#tierSwitch").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button[data-tier]") : null;
    if (!b) return;
    curTier = b.getAttribute("data-tier");
    renderTierSwitch();
    renderFeeTable();
    $("#feeScroll").scrollTop = 0;
  });

  /* ---------- lead form modal : embedded Lark form ---------- */
  var FORM_URL = "https://bytedance.larkoffice.com/share/base/form/shrmycPWyhzDUsFwoZ56OEjVpkD";
  var overlay = $("#overlay");
  var frame = $("#formFrame");
  var note = $("#embedNote");
  var loaded = false;

  $("#openFormTab").setAttribute("href", FORM_URL);
  $("#embedFallback").setAttribute("href", FORM_URL);

  frame.addEventListener("load", function () {
    if (frame.getAttribute("src") === "about:blank") return;
    /* cross-origin embed: a fired load event means the form is rendering */
    loaded = true;
    note.classList.add("hide");
  });

  function openModal() {
    overlay.classList.add("show");
    document.body.style.overflow = "hidden";
    if (!loaded) {
      note.classList.remove("hide");
      if (frame.getAttribute("src") !== FORM_URL) frame.setAttribute("src", FORM_URL);
    }
  }
  function closeModal() {
    overlay.classList.remove("show");
    document.body.style.overflow = "";
  }
  $$("[data-open-form]").forEach(function (b) { b.addEventListener("click", openModal); });
  $("#closeModal").addEventListener("click", closeModal);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });


  renderAll();
})();
</script>
</body>
</html>
